<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de imagenes</title>
    <link rel="stylesheet" href="../Ejercicio3(2.8)/estilos/estilos.css">
</head>
<body>
    <header>
        <h2>Mi galeria de fotos</h2>
        <form>
            <input type="text" placeholder="Buscar...">
            <button type="submit">Buscar</button>
        </form>
    </header>
    
    <nav>
        <ul>
            <li>Inicio</li>
            <li>Galeria</li>
            <li>Acerca de</li>
            <li>Contacto</li>
        </ul>
    </nav>

    <main>
        <div class="parteArriba">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500" alt="paisaje montañoso">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=500" alt="Gato con persona">
            <img src="https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500" alt="Bicicleta antigua">
        </div>

        <div class="parteMedia">
            <img src="https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=500" alt="Oso polar">
            <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=500" alt="Gato negro">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1173&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Playa">
        </div>

        <div class="parteBaja">
            <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=500" alt="Edificio moderno">
            <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=500" alt="Arquitectura">
            <img src="https://images.unsplash.com/photo-1579353977828-2a4eab540b9a?w=500" alt="Otro oso">
        </div>
    </main>

    <footer>
        <div class="footerLeft">
            <p>Redes Sociales</p>
            <img src="" alt="">
            <img src="" alt="">
        </div>

        <div class="footerMid">
            <p>Contacto</p>
            <span>Direccion: Calle Ejemplo 3</span>
            <span>Teléfono: +123456789</span>
            <span>Email: ejemplo@gmail.com</span>
        </div>

        <div class="footerRight">
            <p>Menu</p>
            <span>Inicio</span>
            <span>Galeria</span>
            <span>Acerca de</span>
            <span>Contacto</span>
        </div>
    </footer>
</body>
</html>
